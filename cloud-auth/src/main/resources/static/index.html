<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>cloudMall 登录</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; margin-top: 80px; }
        .box { width: 280px; padding: 24px; border: 1px solid #ddd; border-radius: 8px; }
        input { width: 100%; box-sizing: border-box; margin: 8px 0; padding: 8px; }
        button { width: 100%; padding: 10px; background: #0FDC78; color: #004D26; border: 0; border-radius: 4px; cursor: pointer; }
        .msg { margin-top: 12px; font-size: 14px; }
    </style>
</head>
<body>
<div class="box">
    <h2>cloudMall 登录</h2>
    <input id="username" placeholder="用户名 admin">
    <input id="password" type="password" placeholder="密码 123456">
    <button onclick="doLogin()">登录</button>
    <div id="msg" class="msg"></div>
</div>
<script>
    async function doLogin() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const resp = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await resp.json();
        const el = document.getElementById('msg');
        el.textContent = data.message;
        el.style.color = data.success ? 'green' : 'red';
    }
</script>
</body>
</html>
