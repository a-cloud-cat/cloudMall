server:
  port: 8081

spring:
  application:
    name: cloud-auth
  datasource:
    druid:
      url: jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      username: root
      password: 123456
      driver-class-name: com.mysql.cj.jdbc.Driver
      initial-size: 5
      min-idle: 5
      max-active: 10
      filters: stat
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# Sa-Token 配置（与网关保持一致）
sa-token:
  token-name: Authorization
  timeout: 7200
  is-log: false
  is-read-cookie: false
  is-read-header: true
  token-style: uuid
