server:
  port: 8080

spring:
  application:
    name: cloud-gateway
  main:
    keep-alive: true
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  cloud:
    gateway:
      server:
        webflux: 
          routes:
            - id: auth-route
              uri: http://localhost:8081
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1
            - id: admin-route
              uri: http://localhost:8082
              predicates:
                - Path=/admin/**
              filters:
                - StripPrefix=1

# Sa-Token 配置
sa-token:
  token-name: Authorization
  timeout: 7200
  is-log: false
  is-read-cookie: false
  is-read-header: true
  token-style: uuid
