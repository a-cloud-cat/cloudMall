server:
  port: 8080

spring:
  application:
    name: cloud-gateway
  main:
    keep-alive: true
  cloud:
    gateway:
      server:
        webflux: 
          routes:
            - id: auth-route
              uri: http://localhost:8081
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1
            - id: admin-route
              uri: http://localhost:8082
              predicates:
                - Path=/admin/**
              filters:
                - StripPrefix=1
